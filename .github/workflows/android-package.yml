# Android 客户端打包 → GitHub Release（预留）
# 触发：推送 tag android/v*  或  手动 workflow_dispatch
# 当前仓库尚无 Kotlin/ Android 工程时会跳过构建并给出 warning

name: Android Client Package

on:
  push:
    tags:
      - 'android/v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/android/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/android/}"
            VERSION_NAME="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "version_code=1" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Android project exists
        id: check
        shell: bash
        run: |
          if [ -f kotlin/settings.gradle.kts ] || [ -f kotlin/settings.gradle ] \
             || [ -f Kotlin/settings.gradle.kts ] || [ -f android/settings.gradle.kts ] \
             || [ -f app/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未找到 Android/Kotlin 工程（P3 后续）。本 workflow 已预留 android/v* tag。"
          fi

      - name: Setup JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.exists == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.exists == 'true'
        run: |
          chmod +x kotlin/gradlew 2>/dev/null || true
          chmod +x Kotlin/gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true

      - name: Build debug APK
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -f kotlin/gradlew ]; then
            cd kotlin && ./gradlew assembleRelease --stacktrace
          elif [ -f Kotlin/gradlew ]; then
            cd Kotlin && ./gradlew assembleRelease --stacktrace
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assembleRelease --stacktrace
          else
            echo "gradlew not found"; exit 1
          fi

      - name: Locate APK
        if: steps.check.outputs.exists == 'true'
        id: apk
        shell: bash
        run: |
          APK=$(find . -path '*/outputs/apk/*' -name '*.apk' -type f | head -n 1)
          [ -z "$APK" ] && { echo "No APK found"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RkSonos-Android-${{ steps.ver.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/android/v') && steps.check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          name: Android ${{ steps.ver.outputs.version_name }}
          body: |
            ## RKSonos Android ${{ steps.ver.outputs.version_name }}
            - versionName: `${{ steps.ver.outputs.version_name }}`
            - versionCode: `${{ steps.ver.outputs.version_code }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
