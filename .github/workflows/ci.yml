name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 用 messense/rust-musl-cross 镜像编静态 aarch64，不依赖 musl.cc
  build-aarch64-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static aarch64 (musl via Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            -w /home/rust/src/server \
            messense/rust-musl-cross:aarch64-musl \
            cargo build --release --target aarch64-unknown-linux-musl

      - name: Prepare binary
        run: |
          cp server/target/aarch64-unknown-linux-musl/release/rksonos-server \
             rksonos-server-aarch64-linux-musl
          chmod +x rksonos-server-aarch64-linux-musl
          file rksonos-server-aarch64-linux-musl || true
          # 静态链接应显示 "not a dynamic executable"
          ldd rksonos-server-aarch64-linux-musl 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rksonos-server-aarch64-musl-${{ github.ref_name }}
          path: rksonos-server-aarch64-linux-musl
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rksonos-server-aarch64-linux-musl
          generate_release_notes: true
          fail_on_unmatched_files: true

  check-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: cargo check
        working-directory: server
        run: cargo check
