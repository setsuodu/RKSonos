[package]
name = "rksonos-server"
version = "0.3.2"
edition = "2021"
description = "RKSonos speaker server — P3 mDNS + library/queue"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1"
walkdir = "2"
rand = "0.8"
mdns-sd = "0.13"
if-addrs = "0.13"
