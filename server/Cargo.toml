[package]
name = "rksonos-server"
version = "0.2.1"
edition = "2021"
description = "RKSonos speaker server (P2.1: pause/resume + queue)"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1"
walkdir = "2"
